<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f1729">
  <title>Comp-off Tracker</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      height: 100%;
      overflow: hidden;
      background: #0f1729;
      color: #e8eef8;
    }
    body {
      display: flex;
      justify-content: center;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .app-container {
      max-width: 550px;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, #0f1729 0%, #1a2440 100%);
      overflow: hidden;
      position: relative;
    }

    /* --- ambient glow --- */
    .app-container::before {
      content: '';
      position: absolute;
      top: -120px;
      right: -100px;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(96,165,250,0.15), transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
    .app-container::after {
      content: '';
      position: absolute;
      bottom: -150px;
      left: -100px;
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(168,85,247,0.12), transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ---------- HEADER ---------- */
    .app-header {
      padding: 20px 22px 8px;
      position: relative;
      z-index: 2;
      flex-shrink: 0;
    }
    .app-header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 0%, #a5c9ff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 2px;
    }
    .app-header .subhead {
      font-size: 0.78rem;
      color: #7c8db5;
      letter-spacing: 0.2px;
    }

    /* ---------- STATS ---------- */
    .stats-row {
      display: flex;
      gap: 10px;
      padding: 14px 22px 16px;
      position: relative;
      z-index: 2;
      flex-shrink: 0;
    }
    .stat-ring {
      flex: 1;
      background: rgba(30, 45, 80, 0.6);
      border: 1px solid rgba(96, 165, 250, 0.15);
      border-radius: 20px;
      padding: 12px 8px;
      text-align: center;
      backdrop-filter: blur(20px);
      position: relative;
      overflow: hidden;
    }
    .stat-ring::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, rgba(96,165,250,0.6), transparent);
    }
    .stat-ring.worked::before { background: linear-gradient(90deg, transparent, #4ade80, transparent); }
    .stat-ring.used::before { background: linear-gradient(90deg, transparent, #fbbf24, transparent); }
    .stat-ring.balance::before { background: linear-gradient(90deg, transparent, #60a5fa, transparent); }

    .stat-ring .label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      font-weight: 600;
      color: #7c8db5;
      margin-bottom: 4px;
    }
    .stat-ring .value {
      font-size: 1.7rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -1px;
    }
    .stat-ring.worked .value { color: #4ade80; }
    .stat-ring.used .value { color: #fbbf24; }
    .stat-ring.balance .value { color: #60a5fa; }

    .stat-ring .sub {
      font-size: 0.6rem;
      color: #566b92;
      margin-top: 3px;
    }

    /* ---------- TOOLBAR ---------- */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px 12px;
      gap: 8px;
      position: relative;
      z-index: 2;
      flex-shrink: 0;
    }
    .year-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(30, 45, 80, 0.6);
      border: 1px solid rgba(96, 165, 250, 0.15);
      padding: 6px 6px 6px 14px;
      border-radius: 30px;
      backdrop-filter: blur(20px);
    }
    .year-pill span {
      font-size: 0.72rem;
      color: #7c8db5;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .year-pill select {
      background: transparent;
      border: none;
      color: #e8eef8;
      font-size: 0.9rem;
      font-weight: 700;
      padding: 4px 8px;
      outline: none;
      cursor: pointer;
      font-family: inherit;
    }
    .year-pill select option {
      background: #1a2440;
      color: #e8eef8;
    }

    .icon-btn-ghost {
      background: rgba(30, 45, 80, 0.6);
      border: 1px solid rgba(96, 165, 250, 0.15);
      color: #a5c9ff;
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(20px);
      font-size: 1.1rem;
      transition: 0.15s;
    }
    .icon-btn-ghost:active {
      background: rgba(96, 165, 250, 0.2);
      transform: scale(0.92);
    }

    /* ---------- LIST ---------- */
    .app-body {
      flex: 1;
      overflow-y: auto;
      padding: 0 22px 120px;
      -webkit-overflow-scrolling: touch;
      position: relative;
      z-index: 2;
    }
    .app-body::-webkit-scrollbar { width: 0; }

    .month-group {
      margin-bottom: 18px;
    }
    .month-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      font-weight: 700;
      color: #566b92;
      padding: 6px 4px 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .month-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, rgba(96,165,250,0.2), transparent);
    }

    /* --- CARD --- */
    .day-card {
      background: rgba(30, 45, 80, 0.55);
      border: 1px solid rgba(96, 165, 250, 0.12);
      border-radius: 18px;
      padding: 12px 14px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
      backdrop-filter: blur(20px);
      position: relative;
      overflow: hidden;
      transition: 0.2s;
    }
    .day-card.worked {
      background: linear-gradient(135deg, rgba(74, 222, 128, 0.12), rgba(30, 45, 80, 0.55));
      border-color: rgba(74, 222, 128, 0.3);
    }
    .day-card.used {
      background: linear-gradient(135deg, rgba(251, 191, 36, 0.1), rgba(30, 45, 80, 0.55));
      border-color: rgba(251, 191, 36, 0.25);
    }
    .day-card.custom::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: linear-gradient(180deg, #fbbf24, #f59e0b);
    }
    .day-card.sunday::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: linear-gradient(180deg, #60a5fa, #a855f7);
    }

    .date-box {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: rgba(15, 23, 41, 0.6);
      border: 1px solid rgba(96, 165, 250, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      line-height: 1;
    }
    .date-box .day-num {
      font-size: 1.15rem;
      font-weight: 800;
      color: #e8eef8;
      letter-spacing: -0.5px;
    }
    .date-box .day-mon {
      font-size: 0.58rem;
      font-weight: 700;
      color: #7c8db5;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 3px;
    }
    .day-card.worked .date-box {
      background: rgba(74, 222, 128, 0.15);
      border-color: rgba(74, 222, 128, 0.4);
    }
    .day-card.used .date-box {
      background: rgba(251, 191, 36, 0.15);
      border-color: rgba(251, 191, 36, 0.4);
    }

    .day-info {
      flex: 1;
      min-width: 0;
    }
    .day-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: #e8eef8;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 3px;
    }
    .day-title .tag {
      font-size: 0.55rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 20px;
      background: rgba(251, 191, 36, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(251, 191, 36, 0.3);
    }
    .day-title .tag.holiday {
      background: rgba(168, 85, 247, 0.15);
      color: #c084fc;
      border-color: rgba(168, 85, 247, 0.3);
    }
    .day-meta {
      font-size: 0.7rem;
      color: #7c8db5;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .day-meta .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #566b92;
    }
    .day-card.worked .day-meta .status-dot { background: #4ade80; box-shadow: 0 0 8px #4ade80; }
    .day-card.used .day-meta .status-dot { background: #fbbf24; box-shadow: 0 0 8px #fbbf24; }

    .day-actions {
      display: flex;
      gap: 5px;
      flex-shrink: 0;
    }
    .pill-btn {
      border: none;
      background: rgba(15, 23, 41, 0.7);
      color: #a5c9ff;
      padding: 8px 12px;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid rgba(96, 165, 250, 0.15);
      transition: 0.15s;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }
    .pill-btn:active { transform: scale(0.9); }

    .pill-btn.worked.active {
      background: #4ade80;
      color: #0f1729;
      border-color: #4ade80;
      box-shadow: 0 4px 12px rgba(74, 222, 128, 0.4);
    }
    .pill-btn.used.active {
      background: #fbbf24;
      color: #0f1729;
      border-color: #fbbf24;
      box-shadow: 0 4px 12px rgba(251, 191, 36, 0.4);
    }
    .pill-btn.remove {
      background: rgba(239, 68, 68, 0.12);
      color: #f87171;
      border-color: rgba(239, 68, 68, 0.3);
      padding: 8px 11px;
    }
    .pill-btn.remove:active { background: rgba(239, 68, 68, 0.25); }

    /* FAB */
    .fab {
      position: fixed;
      bottom: calc(24px + env(safe-area-inset-bottom));
      right: 22px;
      width: 58px;
      height: 58px;
      border-radius: 20px;
      background: linear-gradient(135deg, #60a5fa 0%, #a855f7 100%);
      color: white;
      font-size: 1.7rem;
      font-weight: 300;
      border: none;
      box-shadow: 0 8px 24px rgba(96, 165, 250, 0.4);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      line-height: 1;
      padding-bottom: 3px;
    }
    .fab:active { transform: scale(0.9); }

    /* EMPTY */
    .empty-state {
      text-align: center;
      padding: 50px 20px;
      color: #566b92;
    }
    .empty-state .icon {
      font-size: 3rem;
      margin-bottom: 12px;
      opacity: 0.4;
    }
    .empty-state p {
      font-size: 0.85rem;
    }

    /* MODAL */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 10, 20, 0.75);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 100;
      padding-bottom: env(safe-area-inset-bottom);
      backdrop-filter: blur(8px);
    }
    .modal-overlay.show { display: flex; animation: fadeIn 0.2s ease-out; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal {
      background: linear-gradient(180deg, #1a2440 0%, #0f1729 100%);
      width: 100%;
      max-width: 550px;
      border-radius: 28px 28px 0 0;
      padding: 24px 22px 30px;
      animation: slideUp 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      max-height: 92vh;
      overflow-y: auto;
      border-top: 1px solid rgba(96, 165, 250, 0.2);
      position: relative;
    }
    .modal::before {
      content: '';
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      height: 4px;
      background: rgba(124, 141, 181, 0.3);
      border-radius: 10px;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    .modal h2 {
      font-size: 1.2rem;
      font-weight: 700;
      color: #e8eef8;
      margin-bottom: 4px;
      margin-top: 8px;
    }
    .modal .modal-sub {
      font-size: 0.78rem;
      color: #7c8db5;
      margin-bottom: 20px;
    }
    .modal-field { margin-bottom: 14px; }
    .modal-field label {
      display: block;
      font-size: 0.68rem;
      font-weight: 700;
      color: #7c8db5;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 8px;
    }
    .modal-field input {
      width: 100%;
      padding: 13px 16px;
      border-radius: 14px;
      border: 1.5px solid rgba(96, 165, 250, 0.2);
      font-size: 0.95rem;
      background: rgba(15, 23, 41, 0.7);
      color: #e8eef8;
      outline: none;
      font-family: inherit;
      transition: 0.15s;
    }
    .modal-field input:focus {
      border-color: #60a5fa;
      background: rgba(15, 23, 41, 0.9);
      box-shadow: 0 0 0 4px rgba(96, 165, 250, 0.1);
    }
    .modal-field input::placeholder {
      color: #566b92;
    }

    .quick-picks { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
    .chip {
      background: rgba(96, 165, 250, 0.1);
      border: 1px solid rgba(96, 165, 250, 0.25);
      color: #a5c9ff;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 7px 13px;
      border-radius: 30px;
      cursor: pointer;
      transition: 0.12s;
    }
    .chip:active {
      background: rgba(96, 165, 250, 0.25);
      transform: scale(0.95);
    }

    .type-toggle {
      display: flex;
      background: rgba(15, 23, 41, 0.7);
      border-radius: 14px;
      padding: 4px;
      gap: 4px;
      margin-bottom: 18px;
      border: 1px solid rgba(96, 165, 250, 0.15);
    }
    .type-toggle button {
      flex: 1;
      padding: 11px;
      border: none;
      background: transparent;
      border-radius: 11px;
      font-size: 0.82rem;
      font-weight: 600;
      color: #7c8db5;
      cursor: pointer;
      transition: 0.15s;
    }
    .type-toggle button.active {
      background: linear-gradient(135deg, #60a5fa, #a855f7);
      color: white;
      box-shadow: 0 2px 10px rgba(96, 165, 250, 0.3);
    }

    .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
    .modal-actions button {
      flex: 1;
      padding: 14px;
      border-radius: 14px;
      border: none;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.15s;
    }
    .btn-cancel {
      background: rgba(30, 45, 80, 0.7);
      color: #a5c9ff;
      border: 1px solid rgba(96, 165, 250, 0.15);
    }
    .btn-cancel:active { background: rgba(30, 45, 80, 1); }
    .btn-save {
      background: linear-gradient(135deg, #60a5fa 0%, #a855f7 100%);
      color: white;
      box-shadow: 0 6px 16px rgba(96, 165, 250, 0.35);
    }
    .btn-save:active { transform: scale(0.97); }

    /* TOAST */
    .toast {
      position: fixed;
      bottom: calc(100px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(30, 45, 80, 0.95);
      color: #e8eef8;
      padding: 12px 22px;
      border-radius: 40px;
      font-size: 0.82rem;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: 0.25s;
      z-index: 200;
      white-space: nowrap;
      border: 1px solid rgba(96, 165, 250, 0.25);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      max-width: 90%;
      text-align: center;
      backdrop-filter: blur(20px);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
<div class="app-container">
  <div class="app-header">
    <h1>Comp-off Tracker</h1>
    <div class="subhead">Track your Sundays & holidays</div>
  </div>

  <div class="stats-row">
    <div class="stat-ring worked">
      <div class="label">Worked</div>
      <div class="value" id="workedCount">0</div>
      <div class="sub">earned</div>
    </div>
    <div class="stat-ring used">
      <div class="label">Used</div>
      <div class="value" id="usedCount">0</div>
      <div class="sub">leaves</div>
    </div>
    <div class="stat-ring balance">
      <div class="label">Balance</div>
      <div class="value" id="balanceCount">0</div>
      <div class="sub">available</div>
    </div>
  </div>

  <div class="toolbar">
    <div class="year-pill">
      <span>Year</span>
      <select id="yearSelect"></select>
    </div>
    <button class="icon-btn-ghost" id="resetYearBtn" title="Reset year">&#8635;</button>
  </div>

  <div class="app-body" id="dayList"></div>
</div>

<button class="fab" id="fabAdd" title="Add custom day">+</button>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2>Add custom day</h2>
    <div class="modal-sub">Company holiday, extra leave, or special Sunday</div>

    <div class="modal-field">
      <label>Date</label>
      <input type="date" id="modalDate" />
    </div>

    <div class="quick-picks" id="quickPicks"></div>

    <div class="modal-field">
      <label>Label (optional)</label>
      <input type="text" id="modalLabel" placeholder="e.g. Diwali" maxlength="24" />
    </div>

    <div class="modal-field">
      <label>Mark as</label>
      <div class="type-toggle" id="typeToggle">
        <button data-type="none" class="active">Not marked</button>
        <button data-type="worked">Worked</button>
        <button data-type="used">Used</button>
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" id="modalCancel">Cancel</button>
      <button class="btn-save" id="modalSave">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function() {
  const STORAGE_KEY = 'compoff_tracker_ux_v1';
  let allData = {};
  let currentYear = new Date().getFullYear();
  let modalType = 'none';
  let editingDateKey = null;

  const yearSelect = document.getElementById('yearSelect');
  const dayListEl = document.getElementById('dayList');
  const workedCountEl = document.getElementById('workedCount');
  const usedCountEl = document.getElementById('usedCount');
  const balanceCountEl = document.getElementById('balanceCount');
  const resetYearBtn = document.getElementById('resetYearBtn');
  const fabAdd = document.getElementById('fabAdd');
  const modalOverlay = document.getElementById('modalOverlay');
  const modalDate = document.getElementById('modalDate');
  const modalLabel = document.getElementById('modalLabel');
  const modalCancel = document.getElementById('modalCancel');
  const modalSave = document.getElementById('modalSave');
  const typeToggle = document.getElementById('typeToggle');
  const quickPicks = document.getElementById('quickPicks');
  const toastEl = document.getElementById('toast');

  function dateKeyFromDate(date) {
    const mm = String(date.getMonth() + 1).padStart(2, '0');
    const dd = String(date.getDate()).padStart(2, '0');
    return `${date.getFullYear()}-${mm}-${dd}`;
  }
  function dateFromKey(key) {
    const [y, m, d] = key.split('-').map(Number);
    return new Date(y, m - 1, d);
  }
  function getSundaysOfYear(year) {
    const arr = [];
    const d = new Date(year, 0, 1);
    while (d.getDay() !== 0) d.setDate(d.getDate() + 1);
    while (d.getFullYear() === year) {
      arr.push(new Date(d));
      d.setDate(d.getDate() + 7);
    }
    return arr;
  }
  const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  const MONTHS_FULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toastEl.classList.remove('show'), 2000);
  }
  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function loadData() {
    try {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) {
        const parsed = JSON.parse(stored);
        for (const y in parsed) for (const k in parsed[y]) {
          if (typeof parsed[y][k] === 'string') {
            parsed[y][k] = { status: parsed[y][k], label: '', custom: false };
          } else if (!parsed[y][k].hasOwnProperty('custom')) {
            parsed[y][k].custom = false;
          }
        }
        allData = parsed;
      } else allData = {};
    } catch (e) { allData = {}; }
    if (!allData[currentYear]) allData[currentYear] = {};
  }
  function saveData() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(allData)); return true; }
    catch (e) { showToast('Could not save data'); return false; }
  }
  function getYearStats(year) {
    const yd = allData[year] || {};
    let w = 0, u = 0;
    Object.values(yd).forEach(e => {
      if (e.status === 'worked') w++;
      else if (e.status === 'used') u++;
    });
    return { worked: w, used: u, balance: w - u };
  }
  function updateStats() {
    const { worked, used, balance } = getYearStats(currentYear);
    workedCountEl.textContent = worked;
    usedCountEl.textContent = used;
    balanceCountEl.textContent = balance;
  }
  function populateYearSelect() {
    const base = new Date().getFullYear();
    yearSelect.innerHTML = '';
    for (let y = base - 3; y <= base + 3; y++) {
      const o = document.createElement('option');
      o.value = y; o.textContent = y;
      if (y === currentYear) o.selected = true;
      yearSelect.appendChild(o);
    }
  }

  function handleWorkedClick(dateKey) {
    const entry = allData[currentYear]?.[dateKey];
    const label = entry?.label || '';
    const custom = entry?.custom === true;
    if (!allData[currentYear]) allData[currentYear] = {};
    if (entry?.status === 'worked') {
      if (label || custom) allData[currentYear][dateKey] = { status: null, label, custom };
      else delete allData[currentYear][dateKey];
      showToast('Unmarked worked');
    } else {
      allData[currentYear][dateKey] = { status: 'worked', label, custom };
      showToast('Marked as worked');
    }
    saveData(); render();
  }
  function handleUsedClick(dateKey) {
    const entry = allData[currentYear]?.[dateKey];
    const label = entry?.label || '';
    const custom = entry?.custom === true;
    const stats = getYearStats(currentYear);
    if (!allData[currentYear]) allData[currentYear] = {};
    if (entry?.status === 'used') {
      if (label || custom) allData[currentYear][dateKey] = { status: null, label, custom };
      else delete allData[currentYear][dateKey];
      showToast('Unmarked used'); saveData(); render(); return;
    }
    let nw = stats.worked, nu = stats.used;
    if (entry?.status === 'worked') { nw--; nu++; } else nu++;
    if (nw - nu < 0) { showToast('Not enough balance'); return; }
    allData[currentYear][dateKey] = { status: 'used', label, custom };
    saveData(); showToast('Marked as used'); render();
  }
  function handleRemoveClick(dateKey) {
    const entry = allData[currentYear]?.[dateKey];
    if (!entry) return;
    const date = dateFromKey(dateKey);
    const isSunday = date.getDay() === 0;
    const canRemove = !isSunday || entry.custom === true || (entry.label && entry.label.trim() !== '');
    if (!canRemove) { showToast('Regular Sundays cannot be removed'); return; }
    delete allData[currentYear][dateKey];
    saveData();
    showToast('Removed');
    render();
  }

  function render() {
    const sundays = getSundaysOfYear(currentYear);
    const yd = allData[currentYear] || {};
    const map = new Map();

    sundays.forEach(d => {
      const key = dateKeyFromDate(d);
      map.set(key, {
        date: d, key, isSunday: true,
        label: yd[key]?.label || '',
        status: yd[key]?.status || null,
        custom: yd[key]?.custom === true
      });
    });
    for (const [key, entry] of Object.entries(yd)) {
      const date = dateFromKey(key);
      if (date.getFullYear() !== currentYear) continue;
      const isSunday = date.getDay() === 0;
      const custom = entry.custom === true || !isSunday || (entry.label && entry.label.trim() !== '');
      if (map.has(key)) {
        const ex = map.get(key);
        ex.label = entry.label || ex.label;
        ex.status = entry.status || ex.status;
        ex.custom = custom;
      } else {
        map.set(key, { date, key, isSunday, label: entry.label || '', status: entry.status || null, custom });
      }
    }

    const items = Array.from(map.values()).sort((a, b) => a.date - b.date);

    if (items.length === 0) {
      dayListEl.innerHTML = '<div class="empty-state"><div class="icon">&#9679;</div><p>No days yet. Tap + to add.</p></div>';
      updateStats();
      return;
    }

    const groups = new Map();
    items.forEach(item => {
      const mKey = `${item.date.getFullYear()}-${item.date.getMonth()}`;
      if (!groups.has(mKey)) groups.set(mKey, []);
      groups.get(mKey).push(item);
    });

    let html = '';
    groups.forEach((groupItems, mKey) => {
      const [y, m] = mKey.split('-').map(Number);
      html += `<div class="month-group">`;
      html += `<div class="month-label">${MONTHS_FULL[m]} ${y}</div>`;

      groupItems.forEach(item => {
        const { date, key, status, label, isSunday, custom } = item;
        const dayNum = date.getDate();
        const monShort = MONTHS[date.getMonth()];
        const weekday = date.toLocaleDateString('en-US', { weekday: 'long' });

        const workedActive = status === 'worked';
        const usedActive = status === 'used';

        let tagHtml = '';
        if (!isSunday) tagHtml = '<span class="tag holiday">Holiday</span>';
        else if (label || custom) tagHtml = '<span class="tag">Custom</span>';

        let statusText = isSunday ? 'Sunday' : weekday;
        if (label) statusText += ' · ' + escapeHtml(label);

        html += `
          <div class="day-card ${workedActive ? 'worked' : ''} ${usedActive ? 'used' : ''} ${custom ? 'custom' : ''} ${isSunday ? 'sunday' : ''}">
            <div class="date-box">
              <div class="day-num">${dayNum}</div>
              <div class="day-mon">${monShort}</div>
            </div>
            <div class="day-info">
              <div class="day-title">
                ${weekday} ${tagHtml}
              </div>
              <div class="day-meta">
                <span class="status-dot"></span>
                ${statusText}
              </div>
            </div>
            <div class="day-actions">
              <button class="pill-btn worked ${workedActive ? 'active' : ''}" data-key="${key}" data-action="worked">Worked</button>
              <button class="pill-btn used ${usedActive ? 'active' : ''}" data-key="${key}" data-action="used">Used</button>
              ${custom ? `<button class="pill-btn remove" data-key="${key}" data-action="remove">X</button>` : ''}
            </div>
          </div>
        `;
      });

      html += `</div>`;
    });

    dayListEl.innerHTML = html;

    dayListEl.querySelectorAll('.pill-btn').forEach(btn => {
      btn.addEventListener('click', e => {
        e.preventDefault(); e.stopPropagation();
        const { key, action } = btn.dataset;
        if (action === 'worked') handleWorkedClick(key);
        else if (action === 'used') handleUsedClick(key);
        else if (action === 'remove') handleRemoveClick(key);
      });
    });

    updateStats();
  }

  function openModal(prefillKey) {
    editingDateKey = null;
    modalLabel.value = '';
    modalType = 'none';
    updateTypeToggle();

    if (prefillKey) {
      const d = dateFromKey(prefillKey);
      modalDate.value = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      const entry = allData[currentYear]?.[prefillKey];
      if (entry) {
        modalLabel.value = entry.label || '';
        modalType = entry.status || 'none';
        updateTypeToggle();
      }
      editingDateKey = prefillKey;
    } else {
      const t = new Date();
      modalDate.value = `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
    }

    buildQuickPicks();
    modalOverlay.classList.add('show');
  }
  function closeModal() { modalOverlay.classList.remove('show'); editingDateKey = null; }
  function updateTypeToggle() {
    typeToggle.querySelectorAll('button').forEach(b => {
      b.classList.toggle('active', b.dataset.type === modalType);
    });
  }
  function buildQuickPicks() {
    const today = new Date();
    const d = new Date(today);
    while (d.getDay() !== 0) d.setDate(d.getDate() + 1);
    let html = '';
    for (let i = 0; i < 3; i++) {
      const key = dateKeyFromDate(d);
      html += `<button class="chip" data-key="${key}">Sun ${d.getDate()} ${MONTHS[d.getMonth()]}</button>`;
      d.setDate(d.getDate() + 7);
    }
    quickPicks.innerHTML = html;
    quickPicks.querySelectorAll('.chip').forEach(c => {
      c.addEventListener('click', () => {
        const dd = dateFromKey(c.dataset.key);
        modalDate.value = `${dd.getFullYear()}-${String(dd.getMonth()+1).padStart(2,'0')}-${String(dd.getDate()).padStart(2,'0')}`;
      });
    });
  }

  function saveModal() {
    const dateStr = modalDate.value;
    if (!dateStr) { showToast('Pick a date'); return; }
    const [y, m, d] = dateStr.split('-').map(Number);
    const date = new Date(y, m - 1, d);
    const year = date.getFullYear();
    const key = dateKeyFromDate(date);
    const label = modalLabel.value.trim();

    if (editingDateKey && editingDateKey !== key) {
      const oldDate = dateFromKey(editingDateKey);
      const oldYear = oldDate.getFullYear();
      if (allData[oldYear]?.[editingDateKey]) {
        const oe = allData[oldYear][editingDateKey];
        if (oe.custom || oldDate.getDay() !== 0 || oe.label) delete allData[oldYear][editingDateKey];
      }
    }
    if (!allData[year]) allData[year] = {};

    if (modalType === 'used') {
      const stats = getYearStats(year);
      const ce = allData[year][key];
      let nw = stats.worked, nu = stats.used;
      if (ce?.status === 'worked') nw--;
      if (ce?.status === 'used') nu--;
      nu++;
      if (nw - nu < 0) { showToast('Not enough balance'); return; }
    }

    allData[year][key] = {
      status: modalType === 'none' ? null : modalType,
      label: label,
      custom: true
    };
    saveData();
    if (year !== currentYear) { currentYear = year; yearSelect.value = year; }
    closeModal(); render();
    showToast('Saved');
  }

  yearSelect.addEventListener('change', e => {
    currentYear = parseInt(e.target.value, 10);
    if (!allData[currentYear]) allData[currentYear] = {};
    render();
  });
  resetYearBtn.addEventListener('click', () => {
    const yd = allData[currentYear] || {};
    const keys = Object.keys(yd);
    if (keys.length === 0) { showToast(`Nothing to reset`); return; }
    if (!confirm(`Reset all ${keys.length} record(s) for ${currentYear}?`)) return;
    allData[currentYear] = {};
    saveData(); render();
    showToast(`Reset ${currentYear} complete`);
  });
  fabAdd.addEventListener('click', () => openModal());
  modalCancel.addEventListener('click', closeModal);
  modalSave.addEventListener('click', saveModal);
  modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) closeModal(); });
  typeToggle.querySelectorAll('button').forEach(b => {
    b.addEventListener('click', () => { modalType = b.dataset.type; updateTypeToggle(); });
  });
  modalLabel.addEventListener('keypress', e => { if (e.key === 'Enter') { e.preventDefault(); saveModal(); } });

  function init() {
    loadData();
    populateYearSelect();
    yearSelect.value = currentYear;
    render();
  }
  init();
})();
</script>
</body>
</html>
